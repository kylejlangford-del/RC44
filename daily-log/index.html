<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07111d" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png?v=1" />
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png?v=1" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="RC44" />
  <title>Daily Log · RC44</title>
  <link rel="stylesheet" href="../styles.css?v=20261113h" />
</head>
<body>
  <div class="bg-glow bg-glow--one"></div>
  <div class="bg-glow bg-glow--two"></div>

  <main class="site-shell">
    <header class="topbar">
      <a class="brand" href="../" aria-label="Back to RC44">
        <img src="../assets/seagull-lab-logo.png?v=20260925c" alt="Seagull Data" />
        <span class="brand__divider"></span>
        <span class="brand__label">RC44</span>
      </a>
      <div class="title-block"><span>Artemis &amp; Gemera</span><strong>Daily Log</strong></div>
      <a class="ghost-button" href="../">Home</a>
    </header>

    <div class="page">
      <div class="section-kicker">Both boats · day by day</div>
      <h1>Daily log</h1>
      <p class="intro">
        What each boat used, each day. Mains and battens are copied from Main Battens when you start a new
        entry; the rest you fill in. Shared live with both teams.
      </p>

      <div class="log-toolbar">
        <input id="logName" class="log-input" type="text" placeholder="Your name" maxlength="40" />
        <button id="newEntryBtn" class="log-btn log-btn--primary" type="button">+ New entry</button>
      </div>
      <p class="import-step__hint" id="logStatus">Connecting…</p>

      <!-- New / edit entry form -->
      <section class="panel log-form is-hidden" id="logForm">
        <div class="section-kicker" id="logFormTitle">New entry</div>

        <div class="log-grid">
          <label class="log-field"><span>Date</span><input id="fDate" class="log-input" type="date" /></label>
          <label class="log-field"><span>Session</span><input id="fSession" class="log-input" type="text" list="sessionList" placeholder="Training / Race 1–3" maxlength="40" /></label>
          <label class="log-field log-field--small"><span>TWS from</span><input id="fTwsMin" class="log-input" type="number" inputmode="decimal" step="0.5" min="0" max="40" placeholder="kts" /></label>
          <label class="log-field log-field--small"><span>TWS to</span><input id="fTwsMax" class="log-input" type="number" inputmode="decimal" step="0.5" min="0" max="40" placeholder="kts" /></label>
        </div>
        <datalist id="sessionList">
          <option value="Training"></option>
          <option value="Practice race"></option>
          <option value="Race 1–3"></option>
          <option value="Race 4–6"></option>
          <option value="Fleet race"></option>
          <option value="Match race"></option>
        </datalist>
        <datalist id="jibList">
          <option value="G1"></option>
          <option value="J2"></option>
          <option value="J3"></option>
        </datalist>

        <div class="log-boats" id="formBoats"></div>

        <div class="log-form__actions">
          <button id="cancelEntryBtn" class="log-btn" type="button">Cancel</button>
          <button id="saveEntryBtn" class="log-btn log-btn--primary" type="button">Save entry</button>
        </div>
      </section>

      <div id="logList"></div>
    </div>
  </main>

  <script src="../main-battens/data.js"></script>
  <script src="../main-battens/firebase-config.js"></script>
  <script type="module" src="./app.js?v=20261113h"></script>
</body>
</html>
